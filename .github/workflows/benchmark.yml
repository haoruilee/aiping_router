name: PinchBench — Hybrid Model Score

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Preset name from benchmarks/presets.json (overrides individual fields)"
        required: false
        default: ""
      local_model:
        description: "Local Ollama model (e.g. qwen2.5:4b, llama3.2:3b, phi3.5:mini)"
        required: false
        default: "qwen2.5:0.5b"
      cloud_model:
        description: "AIPing cloud model (e.g. Kimi-K2.5, DeepSeek-V3.2, Qwen3-32B)"
        required: false
        default: "Kimi-K2.5"
      threshold:
        description: "Routing threshold 0-100 (85 = ~90% local)"
        required: false
        default: "85"
      suite:
        description: "Tasks: automated-only | all | task_00_sanity,task_09_files,..."
        required: false
        default: "automated-only"
      runs:
        description: "Runs per task (1-3, more = more reliable scores)"
        required: false
        default: "1"
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

jobs:
  benchmark:
    name: >-
      Benchmark ${{ github.event.inputs.local_model || 'qwen2.5:0.5b' }}
      + ${{ github.event.inputs.cloud_model || 'Kimi-K2.5' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ── Resolve parameters (preset overrides individual fields) ─────────────
      - name: Resolve benchmark parameters
        env:
          INPUT_PRESET:      "${{ github.event.inputs.preset }}"
          INPUT_LOCAL_MODEL: "${{ github.event.inputs.local_model || 'qwen2.5:0.5b' }}"
          INPUT_CLOUD_MODEL: "${{ github.event.inputs.cloud_model || 'Kimi-K2.5' }}"
          INPUT_THRESHOLD:   "${{ github.event.inputs.threshold || '85' }}"
          INPUT_SUITE:       "${{ github.event.inputs.suite || 'automated-only' }}"
          INPUT_RUNS:        "${{ github.event.inputs.runs || '1' }}"
        run: python3 scripts/resolve_params.py

      # ── Ollama ───────────────────────────────────────────────────────────────
      - name: Install Ollama
        run: |
          sudo apt-get install -y zstd
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull local model
        run: |
          ollama serve &
          sleep 4
          echo "Pulling $LOCAL_MODEL..."
          ollama pull "$LOCAL_MODEL"
          ollama list
        timeout-minutes: 10

      # ── OpenClaw + plugin ────────────────────────────────────────────────────
      - name: Install OpenClaw
        run: npm install -g openclaw@latest
        timeout-minutes: 3

      - name: Build and install plugin
        run: |
          npm ci && npm run build
          rm -f aiping.cn-model_router-*.tgz
          npm pack
          echo "TARBALL=$(ls aiping.cn-model_router-*.tgz | tail -1)" >> "$GITHUB_ENV"

      - name: Configure plugin
        env:
          AIPING_KEY: ${{ secrets.AIPING_KEY }}
        run: |
          openclaw plugins install "./$TARBALL"
          python3 - <<'EOF'
          import json, os, pathlib
          p = pathlib.Path.home() / '.openclaw' / 'openclaw.json'
          d = json.loads(p.read_text()) if p.exists() else {}

          plugins = d.setdefault('plugins', {})
          entries = plugins.setdefault('entries', {})
          entry   = entries.setdefault('model_router', {})
          cfg     = entry.setdefault('config', {})
          cfg['aipingApiKey']     = os.environ['AIPING_KEY']
          cfg['localModel']       = os.environ['LOCAL_MODEL']
          cfg['localProxyUrl']    = 'http://localhost:11434'
          cfg['cloudModel']       = os.environ['CLOUD_MODEL']
          cfg['routingThreshold'] = int(os.environ['THRESHOLD'])
          cfg['debugRouting']     = False
          cfg['fallbackToCloud']  = True

          # Disable hot-reload so agent creation won't restart gateway mid-run
          d.setdefault('gateway', {}).setdefault('reload', {})['mode'] = 'off'

          p.write_text(json.dumps(d, indent=2))
          print(f"Config: {cfg['localModel']} + {cfg['cloudModel']}, threshold={cfg['routingThreshold']}")
          EOF

      # ── Gateway ──────────────────────────────────────────────────────────────
      - name: Start gateway and register aiping provider
        run: |
          openclaw gateway --port 18789 --allow-unconfigured > /tmp/gateway.log 2>&1 &
          sleep 8
          grep -E "model_router|就绪|agent model" /tmp/gateway.log | head -5 || true

          GW_TOKEN=$(python3 -c "import json; d=json.load(open('$HOME/.openclaw/openclaw.json')); print(d.get('gateway',{}).get('auth',{}).get('token',''))")
          echo "GW_TOKEN=$GW_TOKEN" >> "$GITHUB_ENV"

          python3 - <<EOF
          import json, os, pathlib
          p = pathlib.Path.home() / '.openclaw' / 'openclaw.json'
          d = json.loads(p.read_text())
          models = d.setdefault('models', {})
          providers = models.setdefault('providers', {})
          providers['aiping'] = {
              'baseUrl': 'http://127.0.0.1:18789/aiping/v1',
              'apiKey': '$GW_TOKEN',
              'auth': 'api-key',
              'api': 'openai-completions',
              'models': [{'id': 'aiping:claw', 'name': 'AIPing Router'}],
          }
          d.setdefault('agents', {}).setdefault('defaults', {})['model'] = 'aiping/aiping:claw'
          p.write_text(json.dumps(d, indent=2))
          print("Provider registered: aiping/aiping:claw → http://127.0.0.1:18789/aiping/v1")
          EOF

          # Verify
          curl -sf http://localhost:18789/aiping/health | python3 -c "
          import sys,json; d=json.load(sys.stdin)
          assert d['ok'], f'health check failed: {d}'
          print(f'✅ Plugin ready: local={d[\"localModel\"]} cloud={d[\"cloudModel\"]} threshold={d[\"routingThreshold\"]}')
          "

      # ── Clone PinchBench ─────────────────────────────────────────────────────
      - name: Clone PinchBench skill
        run: git clone --depth 1 https://github.com/pinchbench/skill.git /tmp/pinchbench

      # ── Run 1: Hybrid ────────────────────────────────────────────────────────
      - name: "Run 1/2 — Hybrid (threshold=${{ env.THRESHOLD }})"
        run: |
          cd /tmp/pinchbench
          uv run scripts/benchmark.py \
            --model "aiping/aiping:claw" \
            --suite "$SUITE" \
            --runs "$RUNS" \
            --output-dir /tmp/results/hybrid \
            --no-upload \
            2>&1 | tee /tmp/bench_hybrid.log
        timeout-minutes: 25

      # ── Run 2: Cloud-only ────────────────────────────────────────────────────
      - name: "Run 2/2 — Cloud-only (threshold=0)"
        run: |
          # Update threshold to 0 and restart gateway
          python3 -c "
          import json, pathlib
          p = pathlib.Path.home() / '.openclaw' / 'openclaw.json'
          d = json.loads(p.read_text())
          d['plugins']['entries']['model_router']['config']['routingThreshold'] = 0
          p.write_text(json.dumps(d, indent=2))
          "
          pkill -f "openclaw-gateway" 2>/dev/null || true
          sleep 2
          openclaw gateway --port 18789 --allow-unconfigured > /tmp/gateway2.log 2>&1 &
          sleep 8
          grep -E "阈值=0|threshold=0|就绪" /tmp/gateway2.log | head -3 || true

          cd /tmp/pinchbench
          uv run scripts/benchmark.py \
            --model "aiping/aiping:claw" \
            --suite "$SUITE" \
            --runs "$RUNS" \
            --output-dir /tmp/results/cloud \
            --no-upload \
            2>&1 | tee /tmp/bench_cloud.log
        timeout-minutes: 25

      # ── Comparison report ────────────────────────────────────────────────────
      - name: Generate comparison report
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys, os

          LOCAL  = os.environ.get('LOCAL_MODEL', '?')
          CLOUD  = os.environ.get('CLOUD_MODEL', '?')
          THRESH = os.environ.get('THRESHOLD', '85')

          def load_dir(d, label):
              files = sorted(pathlib.Path(d).glob('*.json'))
              if not files:
                  print(f"No results in {d}")
                  return None
              data = json.loads(files[0].read_text())
              tasks = data.get('tasks', [])
              scores, rows = [], []
              for t in tasks:
                  m = t.get('grading', {}).get('mean', 0.0)
                  scores.append(m)
                  icon = '✅' if m >= 1.0 else '⚠️' if m > 0 else '❌'
                  rows.append((t['task_id'], icon, f"{m*100:.0f}%",
                               t.get('execution_time', 0), t.get('timed_out', False)))
              overall = sum(scores)/len(scores)*100 if scores else 0
              return {'label': label, 'overall': overall, 'n': len(tasks), 'rows': rows}

          hybrid = load_dir('/tmp/results/hybrid', f'Hybrid  (threshold={THRESH})')
          cloud  = load_dir('/tmp/results/cloud',  'Cloud   (threshold=0 )')
          results = [r for r in [hybrid, cloud] if r]

          print()
          print('='*68)
          print(f'  🦀  {LOCAL} (local)  +  {CLOUD} (cloud)')
          print('='*68)
          print(f"  {'Configuration':<35} {'Score':>8}  {'Tasks':>5}")
          print(f"  {'-'*35} {'-'*8}  {'-'*5}")
          for r in results:
              print(f"  {r['label']:<35} {r['overall']:>7.1f}%  {r['n']:>5}")

          if len(results) == 2:
              diff = results[1]['overall'] - results[0]['overall']
              sign = '+' if diff >= 0 else ''
              print(f"\n  Quality delta (cloud - hybrid): {sign}{diff:.1f}pp")
              r0, r1 = results[0], results[1]
              d0, d1 = {r[0]: r for r in r0['rows']}, {r[0]: r for r in r1['rows']}
              tasks = sorted(set(list(d0) + list(d1)))
              print()
              print(f"  {'Task':<38} {'Hybrid':>10}  {'Cloud':>10}  {'Time h/c':>10}")
              print(f"  {'-'*38} {'-'*10}  {'-'*10}  {'-'*10}")
              for tid in tasks:
                  s0 = d0.get(tid, ('-','-','-',0,False))
                  s1 = d1.get(tid, ('-','-','-',0,False))
                  t0 = f"{s0[3]:.0f}s" if isinstance(s0[3],(int,float)) and s0[3]>0 else '-'
                  t1 = f"{s1[3]:.0f}s" if isinstance(s1[3],(int,float)) and s1[3]>0 else '-'
                  to0 = '⏱' if s0[4] else ''
                  to1 = '⏱' if s1[4] else ''
                  print(f"  {tid:<38} {s0[1]+' '+s0[2]+to0:>10}  {s1[1]+' '+s1[2]+to1:>10}  {t0+'/'+t1:>10}")

          print()
          print('='*68)

          # Write report
          summary = {
              'local_model': LOCAL, 'cloud_model': CLOUD, 'threshold': THRESH,
              'results': [{'label': r['label'], 'score': r['overall']} for r in results],
          }
          pathlib.Path('/tmp/benchmark_report.json').write_text(json.dumps(summary, indent=2))

          if results and all(r['overall'] == 0 for r in results):
              print("❌ All scores 0% — check gateway logs")
              sys.exit(1)
          PYEOF

      # ── Sanitize and upload ──────────────────────────────────────────────────
      - name: Sanitize result filenames
        if: always()
        run: find /tmp/results -name "*:*" -exec bash -c 'mv "$1" "${1//:/_}"' _ {} \; 2>/dev/null || true

      - name: Compute sanitized artifact name
        if: always()
        run: |
          SAFE_NAME="bench-$(echo "$LOCAL_MODEL" | tr ':' '-')-$(echo "$CLOUD_MODEL" | tr ':' '-')-${GITHUB_SHA::8}"
          echo "ARTIFACT_NAME=$SAFE_NAME" >> "$GITHUB_ENV"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            /tmp/results/
            /tmp/benchmark_report.json
            /tmp/bench_hybrid.log
            /tmp/bench_cloud.log
          retention-days: 90

      - name: Upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-logs-${{ github.sha }}
          path: /tmp/gateway*.log
