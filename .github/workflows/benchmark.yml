name: PinchBench — Hybrid Model Score

# Run on push to main, on release tags, or manually
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Tasks to run (automated-only | all | task_00_sanity,task_04_weather,...)"
        required: false
        default: "automated-only"
      runs:
        description: "Runs per task (1-3)"
        required: false
        default: "1"
  push:
    branches: ["main"]
  tags:
    - "v*.*.*"

jobs:
  benchmark:
    name: Benchmark hybrid vs cloud-only routing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ── Ollama ───────────────────────────────────────────────────────────────
      - name: Install Ollama + pull qwen2.5:0.5b
        run: |
          sudo apt-get install -y zstd
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 4
          ollama pull qwen2.5:0.5b
        timeout-minutes: 5

      # ── OpenClaw + plugin ────────────────────────────────────────────────────
      - name: Install OpenClaw
        run: npm install -g openclaw@latest
        timeout-minutes: 3

      - name: Build and install plugin
        run: |
          npm ci && npm run build && npm pack
          rm -f aiping.cn-model_router-*.tgz  # remove duplicates first
          npm pack
          echo "TARBALL=$(ls aiping.cn-model_router-*.tgz | tail -1)" >> "$GITHUB_ENV"

      - name: Configure plugin + gateway
        env:
          AIPING_KEY: ${{ secrets.AIPING_KEY }}
        run: |
          openclaw plugins install "./$TARBALL"
          python3 - <<'EOF'
          import json, os, pathlib
          p = pathlib.Path.home() / '.openclaw' / 'openclaw.json'
          root = json.loads(p.read_text()) if p.exists() else {}
          # Plugin config (routing threshold set at run time, not here)
          plugins = root.setdefault('plugins', {})
          entries = plugins.setdefault('entries', {})
          entry   = entries.setdefault('model_router', {})
          cfg     = entry.setdefault('config', {})
          cfg['aipingApiKey']  = os.environ['AIPING_KEY']
          cfg['localModel']    = 'qwen2.5:0.5b'
          cfg['localProxyUrl'] = 'http://localhost:11434'
          cfg['cloudModel']    = 'Kimi-K2.5'
          cfg['routingThreshold'] = 85
          cfg['debugRouting']  = False
          p.write_text(json.dumps(root, indent=2))
          print("Config written")
          EOF

      - name: Start gateway + export token
        run: |
          openclaw gateway --port 18789 --allow-unconfigured > /tmp/gateway.log 2>&1 &
          sleep 8
          grep -E "agent model|model_router|就绪" /tmp/gateway.log || true
          GW_TOKEN=$(python3 -c "import json; d=json.load(open('$HOME/.openclaw/openclaw.json')); print(d.get('gateway',{}).get('auth',{}).get('token',''))")
          echo "GW_TOKEN=$GW_TOKEN" >> "$GITHUB_ENV"

      # ── Clone PinchBench ─────────────────────────────────────────────────────
      - name: Clone PinchBench skill
        run: git clone --depth 1 https://github.com/pinchbench/skill.git /tmp/pinchbench

      # ── Run 1: Hybrid (threshold=85, ~90% local) ─────────────────────────────
      - name: "Run 1/2 — Hybrid router (threshold=85)"
        run: |
          SUITE="${{ github.event.inputs.suite || 'automated-only' }}"
          RUNS="${{ github.event.inputs.runs || '1' }}"
          # Set threshold=85 (default, most requests go local)
          python3 -c "
          import json,pathlib
          p=pathlib.Path.home()/'.openclaw'/'openclaw.json'
          d=json.loads(p.read_text())
          d['plugins']['entries']['model_router']['config']['routingThreshold']=85
          p.write_text(json.dumps(d,indent=2))
          "
          sleep 4  # let gateway reload config

          cd /tmp/pinchbench
          uv run scripts/benchmark.py \
            --model "aiping/aiping:claw" \
            --suite "$SUITE" \
            --runs "$RUNS" \
            --output-dir /tmp/results/hybrid \
            --no-upload \
            2>&1 | tee /tmp/bench_hybrid.log
        timeout-minutes: 25

      # ── Run 2: Cloud-only (threshold=0, 100% cloud via router) ───────────────
      - name: "Run 2/2 — Cloud-only via router (threshold=0)"
        run: |
          SUITE="${{ github.event.inputs.suite || 'automated-only' }}"
          RUNS="${{ github.event.inputs.runs || '1' }}"
          # Set threshold=0 → all requests route to cloud
          python3 -c "
          import json,pathlib
          p=pathlib.Path.home()/'.openclaw'/'openclaw.json'
          d=json.loads(p.read_text())
          d['plugins']['entries']['model_router']['config']['routingThreshold']=0
          p.write_text(json.dumps(d,indent=2))
          "
          sleep 4  # let gateway reload config

          cd /tmp/pinchbench
          uv run scripts/benchmark.py \
            --model "aiping/aiping:claw" \
            --suite "$SUITE" \
            --runs "$RUNS" \
            --output-dir /tmp/results/cloud \
            --no-upload \
            2>&1 | tee /tmp/bench_cloud.log
        timeout-minutes: 25

      # ── Comparison report ────────────────────────────────────────────────────
      - name: Generate comparison report
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, sys

          def load_dir(results_dir: pathlib.Path, label: str):
              files = sorted(results_dir.glob('*.json'))
              if not files:
                  print(f"No result files in {results_dir}")
                  return None
              d = json.loads(files[0].read_text())
              tasks  = d.get('tasks', [])
              scores = []
              rows   = []
              for t in tasks:
                  mean = t.get('grading', {}).get('mean', 0.0)
                  scores.append(mean)
                  icon = '✅' if mean >= 1.0 else '⚠️' if mean > 0 else '❌'
                  rows.append((t['task_id'], icon, f"{mean*100:.0f}%",
                               t.get('execution_time', 0),
                               t.get('timed_out', False)))
              overall = sum(scores) / len(scores) * 100 if scores else 0
              return {'label': label, 'overall': overall, 'n': len(tasks),
                      'rows': rows, 'model': d.get('model', '?')}

          hybrid = load_dir(pathlib.Path('/tmp/results/hybrid'), 'Hybrid (threshold=85)')
          cloud  = load_dir(pathlib.Path('/tmp/results/cloud'),  'Cloud-only (threshold=0)')

          results = [r for r in [hybrid, cloud] if r]

          print()
          print('=' * 70)
          print('  🦀 PinchBench — Hybrid Router vs Cloud-Only Routing')
          print('  Model: aiping/aiping:claw  |  Local: qwen2.5:0.5b  |  Cloud: Kimi-K2.5')
          print('=' * 70)
          print()
          print(f"  {'Configuration':<35} {'Score':>8}  {'Tasks':>6}")
          print(f"  {'-'*35} {'-'*8}  {'-'*6}")
          for r in results:
              print(f"  {r['label']:<35} {r['overall']:>7.1f}%  {r['n']:>6}")
          print()

          if hybrid and cloud:
              diff = cloud['overall'] - hybrid['overall']
              sign = '+' if diff >= 0 else ''
              print(f"  Quality delta (cloud - hybrid): {sign}{diff:.1f}pp")
              print()

          # Per-task breakdown
          if len(results) >= 2:
              r0, r1 = results[0], results[1]
              d0 = {row[0]: row for row in r0['rows']}
              d1 = {row[0]: row for row in r1['rows']}
              tasks = sorted(set(list(d0) + list(d1)))
              print(f"  {'Task':<35} {'Hybrid':>12}  {'Cloud-only':>12}  {'Time(h/c)':>12}")
              print(f"  {'-'*35} {'-'*12}  {'-'*12}  {'-'*12}")
              for tid in tasks:
                  s0 = d0.get(tid, ('-', '-', '-', 0, False))
                  s1 = d1.get(tid, ('-', '-', '-', 0, False))
                  t0 = f"{s0[3]:.0f}s" if isinstance(s0[3], (int,float)) else '-'
                  t1 = f"{s1[3]:.0f}s" if isinstance(s1[3], (int,float)) else '-'
                  to0 = '⏱' if s0[4] else ''
                  to1 = '⏱' if s1[4] else ''
                  print(f"  {tid:<35} {s0[1]+' '+s0[2]+to0:>12}  {s1[1]+' '+s1[2]+to1:>12}  {t0+'/'+t1:>12}")
          print()
          print('=' * 70)

          # Write report
          report = pathlib.Path('/tmp/benchmark_report.txt')
          lines = []
          for r in results:
              lines.append(f"=== {r['label']} ===")
              lines.append(f"Overall: {r['overall']:.1f}%  ({r['n']} tasks)")
              for row in r['rows']:
                  lines.append(f"  {row[0]}: {row[1]} {row[2]}")
              lines.append('')
          report.write_text('\n'.join(lines))

          # Non-zero exit if hybrid scored 0 AND cloud also scored 0 (something broken)
          if results and all(r['overall'] == 0 for r in results):
              print("❌ Both configurations scored 0% — something is wrong")
              sys.exit(1)
          PYEOF

      # ── Sanitize and upload results ──────────────────────────────────────────
      - name: Sanitize result filenames (remove colons for Windows FS compat)
        if: always()
        run: |
          # Rename any files with colons to use underscores
          find /tmp/results -name "*:*" -exec bash -c 'mv "$1" "${1//:/_}"' _ {} \;
          echo "Result files after sanitize:"
          find /tmp/results -name "*.json" | head -10

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            /tmp/results/
            /tmp/benchmark_report.txt
            /tmp/bench_hybrid.log
            /tmp/bench_cloud.log
          retention-days: 30

      - name: Upload gateway log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-log-benchmark
          path: /tmp/gateway.log
